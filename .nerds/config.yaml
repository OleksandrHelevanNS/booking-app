# How the NerdySoft container works on this repo.
setup: cd src/frontend && npm ci

settings:
  directories:
    testsUnit: src/frontend/tests/unit/
    testsIntegration: src/frontend/tests/integration/
  toolchain:
    testFramework: >-
      Vitest + React Testing Library in src/frontend (jsdom environment); add vitest,
      jsdom, @testing-library/react, @testing-library/user-event and
      @testing-library/jest-dom as devDependencies if they are missing, and a "test"
      section in vite.config.ts. Backend: JUnit 5 + Spring Boot Test in
      src/backend/src/test/java/.
    buildCommand: cd src/frontend && npm run build
    lintFixCommand: cd src/frontend && npx oxlint --fix
    lintVerifyCommand: cd src/frontend && npm run lint
    formatFixCommand: ''
    formatVerifyCommand: ''
    testCommand: cd src/frontend && npx vitest run --passWithNoTests
    backendTestCommand: cd src/backend && sh ./mvnw -q -Dmaven.repo.local=$NERDS_CACHE_DIR/m2 test

ci:
  fix:
    - cd src/frontend && npx oxlint --fix
  gates:
    - name: frontend lint
      run: cd src/frontend && npm run lint
      kind: lint
      when: src/frontend/
    - name: frontend build
      run: cd src/frontend && npm run build
      kind: build
      when: src/frontend/
    - name: frontend tests
      run: cd src/frontend && npx vitest run --passWithNoTests
      kind: test
      when: src/frontend/
    - name: backend tests
      run: cd src/backend && sh ./mvnw -q -Dmaven.repo.local=$NERDS_CACHE_DIR/m2 test
      kind: test
      when: src/backend/
      timeout: 900
